services:
  - type: web
    name: nist-attendance-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/attendance.db
    disk:
      name: attendance-data
      mountPath: /data
      size: 1GB
