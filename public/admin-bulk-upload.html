<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Upload | Admin Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Bulk Upload Students
            </h1>
            <a href="admin.html" class="btn-secondary">Back</a>
        </header>

        <div class="card">
            <div class="card-header">
                <div class="card-header-icon">📥</div>
                <h3>Upload Students via CSV</h3>
            </div>
            
            <div style="background: var(--gray-50); padding: 20px; border-radius: var(--radius-sm); margin-bottom: 24px;">
                <h4 style="margin-bottom: 8px;">CSV Format</h4>
                <p style="font-size: 14px; color: var(--gray-600); margin-bottom: 12px;">
                    Upload a CSV file with the following columns:
                </p>
                <code style="display: block; padding: 12px; background: var(--dark); color: var(--success); border-radius: var(--radius-xs); font-size: 13px;">
                    username,password,name<br>
                    student1,pass123,John Doe<br>
                    student2,pass456,Jane Smith
                </code>
                <p style="font-size: 13px; color: var(--gray-500); margin-top: 12px;">
                    ⚠️ All students will be created with role "student" and temporary passwords
                </p>
            </div>

            <div class="form-group">
                <label>Select CSV File</label>
                <input type="file" id="csvFile" accept=".csv" style="padding: 12px; background: var(--gray-50);">
            </div>

            <button onclick="uploadCSV()" class="btn-primary" style="width: 100%;">
                📤 Upload & Create Students
            </button>

            <div id="uploadMsg" style="margin-top: 16px;"></div>
            <div id="uploadResults" style="margin-top: 16px;"></div>
        </div>
    </div>

    <script>
        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';
        })();

        async function uploadCSV() {
            const fileInput = document.getElementById('csvFile');
            const msgDiv = document.getElementById('uploadMsg');
            const resultsDiv = document.getElementById('uploadResults');
            
            if (!fileInput.files[0]) {
                msgDiv.innerHTML = '<div class="text-danger">Please select a CSV file</div>';
                return;
            }

            const file = fileInput.files[0];
            const text = await file.text();
            const lines = text.split('\n').filter(l => l.trim());
            
            if (lines.length < 2) {
                msgDiv.innerHTML = '<div class="text-danger">CSV file is empty or has no data rows</div>';
                return;
            }

            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const rows = lines.slice(1);
            
            msgDiv.innerHTML = '<div style="padding: 12px; background: #dbeafe; border-radius: var(--radius-xs); font-weight: 600;">Processing...</div>';
            resultsDiv.innerHTML = '';

            let successCount = 0;
            let errorCount = 0;
            const errors = [];

            for (let i = 0; i < rows.length; i++) {
                const values = rows[i].split(',').map(v => v.trim());
                
                if (values.length < 3) {
                    errors.push(`Row ${i+2}: Invalid data`);
                    errorCount++;
                    continue;
                }

                const [username, password, name] = values;
                
                try {
                    const res = await fetch('/api/users', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username,
                            password,
                            name,
                            role: 'student'
                        }),
                        credentials: 'same-origin'
                    });
                    
                    if (res.ok) {
                        successCount++;
                    } else {
                        errors.push(`Row ${i+2} (${username}): Username may already exist`);
                        errorCount++;
                    }
                } catch (err) {
                    errors.push(`Row ${i+2}: Network error`);
                    errorCount++;
                }
            }

            msgDiv.innerHTML = `
                <div style="padding: 16px; background: #d1fae5; border-radius: var(--radius-sm); border: 1px solid #a7f3d2;">
                    <strong>✓ Upload Complete!</strong><br>
                    Successfully created ${successCount} students. ${errorCount > 0 ? `${errorCount} errors.` : ''}
                </div>
            `;

            if (errors.length > 0) {
                resultsDiv.innerHTML = `
                    <div style="margin-top: 16px;">
                        <h4 style="color: var(--danger); margin-bottom: 12px;">Errors:</h4>
                        ${errors.map(e => `<div style="padding: 8px; background: #fee2e2; border-radius: var(--radius-xs); margin-bottom: 4px; font-size: 14px;">${e}</div>`).join('')}
                    </div>
                `;
            }
        }

        function logout() {
            fetch('/api/logout', { credentials: 'same-origin' }).then(() => location.href = '/');
        }
    </script>
</body>
</html>
