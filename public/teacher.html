<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/college-logo.jpg" type="image/jpg">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="welcomeHeader">
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Teacher Portal
            </h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="position: relative;">
                    <button onclick="toggleNotifications()" class="btn-secondary" id="notifBtn" style="position: relative; font-size: 16px;">
                        🔔
                        <span id="notifCount" style="display:none; background: var(--danger); color: white; border-radius: 10px; padding: 2px 6px; font-size: 10px; position: absolute; top: -8px; right: -8px;">0</span>
                    </button>
                    <div id="notifDropdown" style="display:none; position: absolute; right: 0; top: 100%; background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); width: 320px; max-height: 400px; overflow-y: auto; z-index: 1000; box-shadow: var(--shadow-md);">
                        <div style="padding: 12px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center;">
                            <strong style="font-size: 14px;">Notifications</strong>
                            <button onclick="readAllNotifications()" style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px;">Mark all read</button>
                        </div>
                        <div id="notifList"></div>
                    </div>
                </div>
                <a href="profile.html" class="btn-secondary" style="text-decoration: none; font-size: 13px;">Profile</a>
                <button onclick="logout()" class="btn-secondary" style="font-size: 13px;">Logout</button>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">SUBJ</div>
                <div class="stat-content">
                    <h3 id="subjectCount">0</h3>
                    <p>Subjects</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">SESS</div>
                <div class="stat-content">
                    <h3 id="activeSessionCount">0</h3>
                    <p>Active Sessions</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">STU</div>
                <div class="stat-content">
                    <h3 id="studentCount">0</h3>
                    <p>Students</p>
                </div>
            </div>
        </div>

        <!-- Create Session Form -->
        <div class="card">
            <div class="card-header">
                <h3>Create Session</h3>
            </div>
            <form id="sessionForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label>Section</label>
                        <select id="sectionSelect" required>
                            <option value="">Select Section</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <select id="subjectSelect" required>
                            <option value="">Select Subject</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label>Topic</label>
                        <input type="text" id="topic" placeholder="e.g., Arrays & Strings" required>
                    </div>
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Start Session</button>
            </form>
            <div id="sessionMsg" class="hidden"></div>
        </div>

        <!-- Active Session QR -->
        <div id="qrSection" class="card hidden">
            <div class="card-header">
                <h3>Active QR Code</h3>
            </div>
            <div class="qr-container">
                <p style="color: var(--gray-500); margin-bottom: 16px; font-size: 14px; font-weight: 600;">
                    ⚡ QR refreshes automatically every 5 seconds
                </p>
                <img id="qrImage" style="max-width: 280px;">
                <div id="sessionInfo" style="margin-top: 24px;"></div>
            </div>
            <button onclick="stopSession()" class="btn-danger" style="margin-top: 16px; width: 100%;">
                Stop Session
            </button>
        </div>

        <!-- Active Sessions List -->
        <div class="card" style="margin-top: 24px;">
            <div class="card-header">
                <h3>Active Sessions</h3>
            </div>
            <div id="activeSessions"></div>
        </div>

        <!-- Quick Links -->
        <div class="quick-actions">
            <a href="teacher-reports.html" class="btn-secondary" style="text-decoration: none;">Reports</a>
            <a href="corrections-review.html" class="btn-secondary" style="text-decoration: none;">Corrections</a>
            <a href="/api/export/attendance?format=xlsx" class="btn-secondary" style="text-decoration: none;">Export</a>
        </div>
    </div>

    <script src="js/teacher.js"></script>
    <script>
        // Notification system
        let notifOpen = false;
        
        function toggleNotifications() {
            const dropdown = document.getElementById('notifDropdown');
            notifOpen = !notifOpen;
            dropdown.style.display = notifOpen ? 'block' : 'none';
            if (notifOpen) loadNotifications();
        }

        function loadNotifications() {
            fetch('/api/notifications', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('notifList');
                    if (data.length === 0) {
                        list.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No notifications</div>';
                        return;
                    }
                    list.innerHTML = data.map(n => `
                        <div style="padding: 12px; border-bottom: 1px solid var(--border); background: ${n.is_read ? 'transparent' : 'var(--bg-secondary)'}; cursor: pointer;" onclick="readNotification(${n.id})">
                            <div style="font-weight: ${n.is_read ? 'normal' : '600'}; font-size: 14px;">${n.title}</div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">${n.message}</div>
                            <div style="font-size: 10px; color: var(--text-secondary); margin-top: 4px;">${new Date(n.created_at).toLocaleString()}</div>
                        </div>
                    `).join('');
                });
        }

        function readNotification(id) {
            fetch('/api/notifications/read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ notificationId: id })
            }).then(() => {
                loadNotifications();
                updateNotifCount();
            });
        }

        function readAllNotifications() {
            fetch('/api/notifications/read-all', {
                method: 'POST',
                credentials: 'same-origin'
            }).then(() => {
                loadNotifications();
                updateNotifCount();
            });
        }

        function updateNotifCount() {
            fetch('/api/notifications/unread-count', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    const countEl = document.getElementById('notifCount');
                    if (data.count > 0) {
                        countEl.textContent = data.count;
                        countEl.style.display = 'block';
                    } else {
                        countEl.style.display = 'none';
                    }
                });
        }

        // Update notification count on page load
        setTimeout(updateNotifCount, 500);
        
        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#notifBtn') && !e.target.closest('#notifDropdown')) {
                document.getElementById('notifDropdown').style.display = 'none';
                notifOpen = false;
            }
        });
    </script>
</body>
</html>
