<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="images/college-logo.jpg" type="image/jpg">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Teacher Portal
            </h1>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-content">
                    <h3 id="subjectCount">0</h3>
                    <p>Subjects</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-content">
                    <h3 id="activeSessionCount">0</h3>
                    <p>Active Sessions</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-content">
                    <h3 id="studentCount">0</h3>
                    <p>Total Students</p>
                </div>
            </div>
        </div>

        <!-- Create Session Form -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-icon">➕</div>
                <h3>Create Attendance Session</h3>
            </div>
            <form id="sessionForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label>Section Name</label>
                        <input type="text" id="sectionName" placeholder="e.g., CSE-A" required>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <select id="subjectSelect" required></select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label>Topic</label>
                        <input type="text" id="topic" placeholder="e.g., Arrays & Strings" required>
                    </div>
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">🚀 Start Session & Generate QR</button>
            </form>
            <div id="sessionMsg" class="hidden"></div>
        </div>

        <!-- Active Session QR -->
        <div id="qrSection" class="card hidden">
            <div class="card-header">
                <div class="card-header-icon">📱</div>
                <h3>Active Session QR Code</h3>
            </div>
            <div class="qr-container">
                <p style="color: var(--gray-500); margin-bottom: 16px; font-size: 14px; font-weight: 600;">
                    ⚡ QR refreshes automatically every 5 seconds
                </p>
                <img id="qrImage" style="max-width: 280px;">
                <div id="sessionInfo" style="margin-top: 24px;"></div>
            </div>
            <button onclick="stopSession()" class="btn-danger" style="margin-top: 16px; width: 100%;">
                ⏹ Stop Session
            </button>
        </div>

        <!-- Active Sessions List -->
        <div class="card" style="margin-top: 24px;">
            <div class="card-header">
                <div class="card-header-icon">📋</div>
                <h3>My Active Sessions</h3>
            </div>
            <div id="activeSessions"></div>
        </div>
    </div>

    <script src="js/teacher.js"></script>
</body>
</html>
