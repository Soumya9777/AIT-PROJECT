<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Teacher Portal
            </h1>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </header>

        <!-- Create Session Form -->
        <div class="card">
            <h3>Create Attendance Session</h3>
            <form id="sessionForm">
                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="sectionName" required>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select id="subjectSelect"></select>
                </div>
                <div class="form-group">
                    <label>Topic</label>
                    <input type="text" id="topic" required>
                </div>
                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" id="startTime" required>
                </div>
                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" id="endTime" required>
                </div>
                <button type="submit" class="btn-primary">Start Session</button>
            </form>
            <div id="sessionMsg" class="hidden"></div>
        </div>

        <!-- Active Session QR -->
        <div id="qrSection" class="card hidden" style="text-align: center; margin-top: 20px;">
            <h3>Active Session QR Code</h3>
            <p>QR refreshes every 5 seconds</p>
            <img id="qrImage" style="margin: 20px auto; display: block;">
            <div id="sessionInfo"></div>
            <button onclick="stopSession()" class="btn-secondary">Stop Session</button>
        </div>

        <!-- Active Sessions List -->
        <div class="card" style="margin-top: 20px;">
            <h3>Active Sessions</h3>
            <div id="activeSessions"></div>
        </div>
    </div>

    <script src="js/faculty.js"></script>
</body>
</html>
