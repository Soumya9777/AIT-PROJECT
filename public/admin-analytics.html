<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - AIT Attendance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles-professional.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
        .chart-container { background: var(--bg-secondary); padding: 20px; border-radius: 12px; margin: 20px 0; }
        .filter-bar { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .filter-bar select, .filter-bar input { padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
        .at-risk-item { 
            background: #fee2e2; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px;
            border-left: 4px solid #ef4444;
        }
        .dark-mode .at-risk-item { background: #7f1d1d; }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎓 AIT Attendance</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item">📊 Dashboard</a>
                <a href="admin-analytics.html" class="nav-item active">📈 Analytics</a>
                <a href="admin-audit-logs.html" class="nav-item">📋 Audit Logs</a>
                <a href="admin-manage-users.html" class="nav-item">👥 Users</a>
                <a href="#" class="nav-item" onclick="logout()">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1>Attendance Analytics</h1>
            </div>

            <div class="filter-bar">
                <select id="sectionFilter">
                    <option value="">All Sections</option>
                </select>
                <select id="subjectFilter">
                    <option value="">All Subjects</option>
                </select>
                <input type="date" id="startDate">
                <input type="date" id="endDate">
                <button class="btn btn-primary" onclick="loadAnalytics()">🔍 Filter</button>
                <button class="btn btn-success" onclick="exportData()">📥 Export</button>
            </div>

            <div class="stats-grid">
                <div class="card" style="text-align: center;">
                    <h3>At-Risk Students</h3>
                    <h1 id="atRiskCount" style="color: #ef4444;">0</h1>
                    <p style="font-size: 12px;">Below 75% attendance</p>
                </div>
                <div class="card" style="text-align: center;">
                    <h3>Average Attendance</h3>
                    <h1 id="avgAttendance" style="color: #10b981;">0%</h1>
                </div>
            </div>

            <div class="chart-container">
                <h3>Daily Attendance Trend</h3>
                <canvas id="attendanceChart"></canvas>
            </div>

            <div class="card">
                <h3>Students At Risk (Below 75%)</h3>
                <div id="atRiskList"></div>
            </div>
        </main>
    </div>

    <script>
        let attendanceChart = null;

        checkAuth();
        loadFilters();
        loadAnalytics();

        function checkAuth() {
            fetch('/api/session')
                .then(res => res.json())
                .then(data => {
                    if (!data.id || data.role !== 'admin') {
                        window.location.href = '/';
                    }
                });
        }

        function loadFilters() {
            fetch('/api/sections')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('sectionFilter');
                    data.forEach(s => {
                        select.innerHTML += `<option value="${s.name}">${s.name}</option>`;
                    });
                });
            
            fetch('/api/subjects')
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('subjectFilter');
                    data.forEach(s => {
                        select.innerHTML += `<option value="${s.name}">${s.name}</option>`;
                    });
                });
        }

        function loadAnalytics() {
            const section = document.getElementById('sectionFilter').value;
            const subject = document.getElementById('subjectFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            let params = new URLSearchParams();
            if (section) params.append('section', section);
            if (subject) params.append('subject', subject);
            if (startDate) params.append('startDate', startDate);
            if (endDate) params.append('endDate', endDate);

            fetch(`/api/analytics/attendance?${params.toString()}`)
                .then(res => res.json())
                .then(data => {
                    updateChart(data);
                    calculateAverage(data);
                });

            fetch(`/api/analytics/at-risk?threshold=75&section=${section}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('atRiskCount').textContent = data.length;
                    const list = document.getElementById('atRiskList');
                    if (data.length === 0) {
                        list.innerHTML = '<p>No students at risk. Great job! 🎉</p>';
                        return;
                    }
                    list.innerHTML = data.map(s => `
                        <div class="at-risk-item">
                            <strong>${s.name}</strong> (${s.section})
                            <div>Attendance: ${s.attendance_percentage.toFixed(2)}%</div>
                            <div style="font-size: 12px; margin-top: 5px;">
                                ${s.attended_sessions}/${s.total_sessions} sessions attended
                            </div>
                        </div>
                    `).join('');
                });
        }

        function updateChart(data) {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            
            if (attendanceChart) attendanceChart.destroy();

            const labels = [...new Set(data.map(d => d.date))].slice(-30);
            const datasets = [];

            const subjects = [...new Set(data.map(d => d.subject))];
            const colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];

            subjects.forEach((subject, idx) => {
                const subjectData = labels.map(date => {
                    const record = data.find(d => d.date === date && d.subject === subject);
                    return record ? (record.present_count / record.total_students * 100) : 0;
                });

                datasets.push({
                    label: subject,
                    data: subjectData,
                    borderColor: colors[idx % colors.length],
                    backgroundColor: colors[idx % colors.length] + '20',
                    tension: 0.4
                });
            });

            attendanceChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100, title: { display: true, text: 'Attendance %' } }
                    }
                }
            });
        }

        function calculateAverage(data) {
            if (data.length === 0) {
                document.getElementById('avgAttendance').textContent = '0%';
                return;
            }
            const avg = data.reduce((sum, d) => sum + (d.present_count / d.total_students * 100), 0) / data.length;
            document.getElementById('avgAttendance').textContent = avg.toFixed(2) + '%';
        }

        function exportData() {
            window.open('/api/export/attendance?format=xlsx', '_blank');
        }

        function logout() {
            fetch('/api/logout').then(() => window.location.href = '/');
        }
    </script>
</body>
</html>
