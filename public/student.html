<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="images/college-logo.jpg" type="image/jpg">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="welcomeHeader">
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Student Portal
            </h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <a href="profile.html" class="btn-secondary" style="text-decoration: none;">👤 Profile</a>
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </header>

        <!-- Overall Attendance Percentage -->
        <div id="attendancePercentage">
            <div class="percentage-display">
                <div id="overallPercentage" class="percentage-number">0%</div>
                <div id="overallDetails" class="percentage-label">Loading...</div>
            </div>
            
            <!-- Attendance Visualization -->
            <div class="card" style="margin-top: 24px;">
                <div class="card-header">
                    <div class="card-header-icon">📈</div>
                    <h3>Attendance Visualization</h3>
                </div>
                <div id="attendanceChart" style="padding: 20px;"></div>
            </div>
            
            <!-- Subject-wise Percentages -->
            <div class="card" style="margin-top: 24px;">
                <div class="card-header">
                    <div class="card-header-icon">📊</div>
                    <h3>Attendance by Subject</h3>
                </div>
                <div id="subjectPercentages"></div>
            </div>
        </div>

        <!-- Quick Action -->
        <div class="card" style="text-align: center; padding: 40px;">
            <div style="font-size: 64px; margin-bottom: 16px;">📱</div>
            <h3 style="margin-bottom: 8px;">Mark Your Attendance</h3>
            <p style="color: var(--gray-500); margin-bottom: 24px;">
                Scan the QR code shown by your teacher to mark attendance
            </p>
            <a href="scan.html" class="btn-primary" style="text-decoration: none; font-size: 18px; padding: 18px 36px;">
                📷 Scan & Mark Attendance
            </a>
        </div>

        <!-- Attendance Records -->
        <div class="card" style="margin-top: 24px;">
            <div class="card-header">
                <div class="card-header-icon">📋</div>
                <h3>Recent Attendance Records</h3>
            </div>
            <div id="attendanceList"></div>
        </div>
    </div>

    <script src="js/student.js"></script>
</body>
</html>
