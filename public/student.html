<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Student Portal
            </h1>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </header>

        <div class="card" style="text-align: center; padding: 40px;">
            <h3>Attendance</h3>
            <p>Click below to scan QR and mark your attendance</p>
            <a href="scan.html" class="btn-primary" style="display: inline-block; margin-top: 20px; text-decoration: none;">
                Scan & Mark Attendance
            </a>
        </div>

        <div id="attendancePercentage">
            <!-- Overall Percentage Card -->
            <div class="percentage-display">
                <div id="overallPercentage" class="percentage-number">0%</div>
                <div id="overallDetails" class="percentage-label">Loading...</div>
            </div>
            
            <!-- Subject-wise Percentages -->
            <div class="card" style="margin-top: 20px;">
                <h3>Attendance by Subject</h3>
                <div id="subjectPercentages"></div>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>My Attendance Records</h3>
            <div id="attendanceList"></div>
        </div>
    </div>

    <script src="js/student.js"></script>
    <script>
        // Check if face data is registered on page load
        (async () => {
            try {
                const res = await fetch('/api/faces');
                const faces = await res.json();
                const hasFaceData = faces.some(f => f.userId === (await (await fetch('/api/session')).json()).id);
                
                if (!hasFaceData) {
                    const scanLink = document.querySelector('a[href="scan.html"]');
                    if (scanLink) {
                        scanLink.style.pointerEvents = 'none';
                        scanLink.style.opacity = '0.5';
                        scanLink.insertAdjacentHTML('afterend', 
                            '<div style="color: #dc3545; margin-top: 10px; padding: 10px; background: #f8d7da; border-radius: 8px;">' +
                            '⚠️ Face data not registered! Contact admin to register your face before marking attendance.' +
                            '</div>');
                    }
                }
            } catch (err) {
                console.error('Error checking face data:', err);
            }
        })();
    </script>
</body>
</html>
