<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Student Portal</h1>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </header>

        <div class="card" style="text-align: center; padding: 40px;">
            <h3>Attendance</h3>
            <p>Click below to scan QR and mark your attendance</p>
            <a href="scan.html" class="btn-primary" style="display: inline-block; margin-top: 20px; text-decoration: none;">
                Scan & Mark Attendance
            </a>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Attendance Percentage</h3>
            <div id="attendancePercentage" style="text-align: center; padding: 20px;">
                <div id="overallPercentage" style="font-size: 48px; font-weight: 700; color: #667eea;"></div>
                <div id="overallDetails" style="margin-top: 10px; color: #666;"></div>
            </div>
            <div id="subjectPercentages" style="margin-top: 20px;"></div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>My Attendance Records</h3>
            <div id="attendanceList"></div>
        </div>
    </div>

    <script src="js/student.js"></script>
</body>
</html>
