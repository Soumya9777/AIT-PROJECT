<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings | Admin</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                System Settings
            </h1>
            <a href="admin.html" class="btn-secondary">Back</a>
        </header>

        <div class="card">
            <div class="card-header">
                <div class="card-header-icon">⚙️</div>
                <h3>General Settings</h3>
            </div>
            
            <div style="display: grid; gap: 24px;">
                <div class="form-group">
                    <label>College Name</label>
                    <input type="text" id="collegeName" placeholder="NIST" value="NIST">
                </div>
                
                <div class="form-group">
                    <label>Session Timeout (minutes)</label>
                    <input type="number" id="sessionTimeout" value="60" min="15" max="480">
                </div>
                
                <div class="form-group">
                    <label>QR Code Refresh Interval (seconds)</label>
                    <input type="number" id="qrRefreshInterval" value="5" min="3" max="30">
                </div>
                
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label style="margin: 0; text-transform: none; letter-spacing: 0;">
                        Enable Face Verification for Login
                    </label>
                    <input type="checkbox" id="enableFaceVerify" checked style="width: 20px; height: 20px;">
                </div>
                
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label style="margin: 0; text-transform: none; letter-spacing: 0;">
                        Allow Students to View Attendance Percentage
                    </label>
                    <input type="checkbox" id="allowPercentage" checked style="width: 20px; height: 20px;">
                </div>
                
                <div style="display: flex; gap: 12px; align-items: center;">
                    <label style="margin: 0; text-transform: none; letter-spacing: 0;">
                        Enable Dark Mode
                    </label>
                    <input type="checkbox" id="darkMode" style="width: 20px; height: 20px;" onchange="toggleDarkMode(this.checked)">
                </div>

                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
                    <h4 style="margin-bottom: 12px;">📍 Geofencing Settings</h4>
                    <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 12px;">
                        Set the college location coordinates for geofencing. Students must be within the allowed radius to mark attendance.
                    </p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label>Latitude</label>
                            <input type="number" id="collegeLat" step="any" placeholder="21.8934" value="21.8934">
                        </div>
                        <div class="form-group">
                            <label>Longitude</label>
                            <input type="number" id="collegeLng" step="any" placeholder="86.9325" value="86.9325">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Allowed Radius (meters)</label>
                        <input type="number" id="allowedRadius" value="500" min="100" max="5000">
                    </div>
                </div>
            </div>
            
            <button onclick="saveSettings()" class="btn-primary" style="margin-top: 24px; width: 100%;">
                💾 Save Settings
            </button>
            <div id="settingsMsg" style="margin-top: 16px;"></div>
        </div>

        <!-- Backup & Restore -->
        <div class="card" style="margin-top: 24px;">
            <div class="card-header">
                <div class="card-header-icon">💾</div>
                <h3>Backup & Restore</h3>
            </div>
            
            <p style="color: var(--gray-600); margin-bottom: 16px;">
                Download a backup of the database or restore from a previous backup.
            </p>
            
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
                <button onclick="backupDB()" class="btn-primary">📥 Create Backup</button>
            </div>

            <div>
                <h4>Available Backups</h4>
                <div id="backupsList"></div>
            </div>
        </div>
    </div>

    <script>
        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';
            
            loadSettings();
        })();

        async function loadSettings() {
            // In a real app, these would come from the database
            // For now, we'll use localStorage
            const settings = JSON.parse(localStorage.getItem('ait-settings') || '{}');
            
            if (settings.collegeName) document.getElementById('collegeName').value = settings.collegeName;
            if (settings.sessionTimeout) document.getElementById('sessionTimeout').value = settings.sessionTimeout;
            if (settings.qrRefreshInterval) document.getElementById('qrRefreshInterval').value = settings.qrRefreshInterval;
            if (settings.enableFaceVerify !== undefined) document.getElementById('enableFaceVerify').checked = settings.enableFaceVerify;
            if (settings.allowPercentage !== undefined) document.getElementById('allowPercentage').checked = settings.allowPercentage;
            if (settings.darkMode !== undefined) {
                document.getElementById('darkMode').checked = settings.darkMode;
                if (settings.darkMode) document.documentElement.setAttribute('dark-mode', '');
            }
            if (settings.collegeLocation) {
                document.getElementById('collegeLat').value = settings.collegeLocation.lat;
                document.getElementById('collegeLng').value = settings.collegeLocation.lng;
            }
            if (settings.allowedRadius) document.getElementById('allowedRadius').value = settings.allowedRadius;
        }

        function toggleDarkMode(enabled) {
            if (enabled) {
                document.documentElement.setAttribute('dark-mode', '');
            } else {
                document.documentElement.removeAttribute('dark-mode');
            }
        }

        function saveSettings() {
            const settings = {
                collegeName: document.getElementById('collegeName').value,
                sessionTimeout: parseInt(document.getElementById('sessionTimeout').value),
                qrRefreshInterval: parseInt(document.getElementById('qrRefreshInterval').value),
                enableFaceVerify: document.getElementById('enableFaceVerify').checked,
                allowPercentage: document.getElementById('allowPercentage').checked,
                darkMode: document.getElementById('darkMode').checked,
                collegeLocation: {
                    lat: parseFloat(document.getElementById('collegeLat').value),
                    lng: parseFloat(document.getElementById('collegeLng').value)
                },
                allowedRadius: parseInt(document.getElementById('allowedRadius').value)
            };
            
            localStorage.setItem('ait-settings', JSON.stringify(settings));
            
            const msgEl = document.getElementById('settingsMsg');
            msgEl.innerHTML = '<div class="text-success">✓ Settings saved successfully!</div>';
            
            setTimeout(() => {
                msgEl.innerHTML = '';
            }, 3000);
            
            showToast('Settings saved!', 'success');
        }

        function backupDB() {
            fetch('/api/backup', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    showToast(data.message || 'Backup created!', 'success');
                    loadBackups();
                })
                .catch(err => showToast('Backup failed: ' + err.message, 'error'));
        }

        function restoreDB(input) {
            if (!input.files[0]) return;
            
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const backupDir = '/backups/';
                // In production, you'd upload to server
                showToast('Please use the server-side restore from the backups list below', 'info');
            };
            reader.readAsText(file);
            input.value = '';
        }

        function loadBackups() {
            fetch('/api/backups', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('backupsList');
                    if (!list) return;
                    if (data.length === 0) {
                        list.innerHTML = '<p>No backups found.</p>';
                        return;
                    }
                    list.innerHTML = data.map(b => `
                        <div style="background: var(--gray-50); padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                            <span>📄 ${b.filename}</span>
                            <button class="btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="restoreFromBackup('${b.filename}')">
                                🔄 Restore
                            </button>
                        </div>
                    `).join('');
                });
        }

        function restoreFromBackup(filename) {
            if (!confirm(`Are you sure you want to restore from ${filename}? This will overwrite current data.`)) return;
            
            fetch('/api/restore', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ backupFile: filename })
            })
            .then(res => res.json())
            .then(data => {
                showToast(data.message || 'Restore completed!', 'success');
            })
            .catch(err => showToast('Restore failed: ' + err.message, 'error'));
        }

        // Load backups on page load
        setTimeout(loadBackups, 500);

        function logout() {
            fetch('/api/logout', { credentials: 'same-origin' }).then(() => location.href = '/');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
