<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="welcomeHeader">
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Admin Dashboard
            </h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="position: relative;">
                    <button onclick="toggleNotifications()" class="btn-secondary" id="notifBtn" style="position: relative;">
                        🔔
                        <span id="notifCount" style="display:none; background: var(--danger); color: white; border-radius: 10px; padding: 2px 6px; font-size: 10px; position: absolute; top: -8px; right: -8px;">0</span>
                    </button>
                    <div id="notifDropdown" style="display:none; position: absolute; right: 0; top: 100%; background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); width: 320px; max-height: 400px; overflow-y: auto; z-index: 1000; box-shadow: var(--shadow-md);">
                        <div style="padding: 12px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center;">
                            <strong style="font-size: 14px;">Notifications</strong>
                            <button onclick="readAllNotifications()" style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px;">Mark all read</button>
                        </div>
                        <div id="notifList"></div>
                    </div>
                </div>
                <a href="profile.html" class="btn-secondary" style="text-decoration: none; font-size: 13px;">Profile</a>
                <a href="admin-settings.html" class="btn-secondary" style="text-decoration: none; font-size: 13px;">Settings</a>
                <button onclick="logout()" class="btn-secondary" style="font-size: 13px;">Logout</button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">USERS</div>
                <div class="stat-content">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">SUBJ</div>
                <div class="stat-content">
                    <h3 id="totalSubjects">0</h3>
                    <p>Subjects</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">SESS</div>
                <div class="stat-content">
                    <h3 id="totalSessions">0</h3>
                    <p>Active Sessions</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">REC</div>
                <div class="stat-content">
                    <h3 id="totalAttendance">0</h3>
                    <p>Records</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <a href="admin-manage-users.html" class="btn-primary" style="text-decoration: none;">Manage Users</a>
            <a href="admin-add-user.html" class="btn-secondary" style="text-decoration: none;">Add User</a>
            <a href="admin-analytics.html" class="btn-secondary" style="text-decoration: none;">Analytics</a>
            <a href="corrections-review.html" class="btn-secondary" style="text-decoration: none;">Corrections</a>
        </div>
    </div>

    <script>
        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';
            
            if (data.name) {
                document.getElementById('welcomeHeader').innerHTML = `
                    <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                    Welcome, ${data.name}
                `;
            }
            
            loadStats();
        })();

        async function loadStats() {
            const usersRes = await fetch('/api/users', { credentials: 'same-origin' });
            const users = await usersRes.json();
            document.getElementById('totalUsers').textContent = users.length;

            const subjectsRes = await fetch('/api/subjects', { credentials: 'same-origin' });
            const subjects = await subjectsRes.json();
            document.getElementById('totalSubjects').textContent = subjects.length;

            const sessionsRes = await fetch('/api/attendance/sessions/active', { credentials: 'same-origin' });
            const sessions = await sessionsRes.json();
            document.getElementById('totalSessions').textContent = sessions.length;

            const reportsRes = await fetch('/api/attendance/reports', { credentials: 'same-origin' });
            const reports = await reportsRes.json();
            document.getElementById('totalAttendance').textContent = reports.length;
        }

        function logout() {
            fetch('/api/logout', { credentials: 'same-origin' }).then(() => location.href = '/');
        }

        // Notification system
        let notifOpen = false;
        
        function toggleNotifications() {
            const dropdown = document.getElementById('notifDropdown');
            notifOpen = !notifOpen;
            dropdown.style.display = notifOpen ? 'block' : 'none';
            if (notifOpen) loadNotifications();
        }

        function loadNotifications() {
            fetch('/api/notifications', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('notifList');
                    if (data.length === 0) {
                        list.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No notifications</div>';
                        return;
                    }
                    list.innerHTML = data.map(n => `
                        <div style="padding: 12px; border-bottom: 1px solid var(--border); background: ${n.is_read ? 'transparent' : 'var(--bg-secondary)'}; cursor: pointer;" onclick="readNotification(${n.id})">
                            <div style="font-weight: ${n.is_read ? 'normal' : '600'}; font-size: 14px;">${n.title}</div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">${n.message}</div>
                            <div style="font-size: 10px; color: var(--text-secondary); margin-top: 4px;">${new Date(n.created_at).toLocaleString()}</div>
                        </div>
                    `).join('');
                });
        }

        function readNotification(id) {
            fetch('/api/notifications/read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ notificationId: id })
            }).then(() => {
                loadNotifications();
                updateNotifCount();
            });
        }

        function readAllNotifications() {
            fetch('/api/notifications/read-all', {
                method: 'POST',
                credentials: 'same-origin'
            }).then(() => {
                loadNotifications();
                updateNotifCount();
            });
        }

        function updateNotifCount() {
            fetch('/api/notifications/unread-count', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    const countEl = document.getElementById('notifCount');
                    if (data.count > 0) {
                        countEl.textContent = data.count;
                        countEl.style.display = 'block';
                    } else {
                        countEl.style.display = 'none';
                    }
                });
        }

        // Update notification count on page load
        setTimeout(updateNotifCount, 500);
        
        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#notifBtn') && !e.target.closest('#notifDropdown')) {
                document.getElementById('notifDropdown').style.display = 'none';
                notifOpen = false;
            }
        });
    </script>
</body>
</html>
