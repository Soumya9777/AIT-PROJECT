<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Admin Portal
            </h1>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </header>

        <div style="display: flex; flex-direction: column; gap: 16px; max-width: 600px;">
            <a href="admin-add-user.html" class="card" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 20px; padding: 24px;">
                <div style="font-size: 40px; width: 60px; text-align: center; flex-shrink: 0;">👤</div>
                <div>
                    <h3 style="margin: 0 0 4px 0; font-size: 18px;">Add User</h3>
                    <p style="color: var(--secondary); font-size: 14px; margin: 0;">Create new student or teacher account</p>
                </div>
            </a>

            <a href="admin-add-subject.html" class="card" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 20px; padding: 24px;">
                <div style="font-size: 40px; width: 60px; text-align: center; flex-shrink: 0;">📚</div>
                <div>
                    <h3 style="margin: 0 0 4px 0; font-size: 18px;">Add Subject</h3>
                    <p style="color: var(--secondary); font-size: 14px; margin: 0;">Add new subjects to the system</p>
                </div>
            </a>

            <a href="admin-add-face.html" class="card" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 20px; padding: 24px;">
                <div style="font-size: 40px; width: 60px; text-align: center; flex-shrink: 0;">📷</div>
                <div>
                    <h3 style="margin: 0 0 4px 0; font-size: 18px;">Add Face</h3>
                    <p style="color: var(--secondary); font-size: 14px; margin: 0;">Register face data for users</p>
                </div>
            </a>

            <a href="admin-manage-users.html" class="card" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 20px; padding: 24px;">
                <div style="font-size: 40px; width: 60px; text-align: center; flex-shrink: 0;">⚙️</div>
                <div>
                    <h3 style="margin: 0 0 4px 0; font-size: 18px;">Manage Users</h3>
                    <p style="color: var(--secondary); font-size: 14px; margin: 0;">Reset passwords and delete users</p>
                </div>
            </a>
        </div>
    </div>

    <script>
        function logout() {
            fetch('/api/logout').then(() => location.href = '/');
        }

        // Check auth
        (async () => {
            const res = await fetch('/api/session');
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';
        })();
    </script>
</body>
</html>
