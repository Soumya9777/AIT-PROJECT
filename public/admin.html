<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AIT Attendance</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    AIT Attendance
                </h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item active">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </span>
                    Dashboard
                </a>
                <a href="admin-analytics.html" class="nav-item">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </span>
                    Analytics
                </a>
                <a href="admin-manage.html" class="nav-item" id="manageNav">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </span>
                    Manage
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: auto;">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </a>
                <div class="nav-submenu" id="manageSubmenu" style="display: none;">
                    <a href="admin-manage-users.html" class="nav-subitem">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        Users
                    </a>
                    <a href="admin-manage-classes.html" class="nav-subitem">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 0 3 3h7z"/>
                        </svg>
                        Classes
                    </a>
                    <a href="admin-manage-subjects.html" class="nav-subitem">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        Subjects
                    </a>
                </div>
                <a href="corrections-review.html" class="nav-item">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </span>
                    Corrections
                </a>
                <a href="admin-audit-logs.html" class="nav-item">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                    </span>
                    Audit Logs
                </a>
                <a href="admin-settings.html" class="nav-item">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.94 1.94 0 0 0 .14 3.27 1.94 1.94 0 0 1 0 2.46 1.94 1.94 0 0 1-2.46 0 1.94 1.94 0 0 1-.14-3.27 1.94 1.94 0 0 1 0-2.46 1.94 1.94 0 0 1 2.46 0z"/>
                            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                        </svg>
                    </span>
                    Settings
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1 id="welcomeHeader">
                    <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                    <span>Admin Dashboard</span>
                </h1>
                <div class="header-actions">
                    <div style="position: relative;">
                        <button onclick="toggleNotifications()" class="btn-icon" id="notifBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                            </svg>
                            <span class="notif-badge" id="notifCount">0</span>
                        </button>
                        <div class="notif-dropdown" id="notifDropdown">
                            <div class="notif-header">
                                <strong>Notifications</strong>
                                <button onclick="readAllNotifications()">Mark all read</button>
                            </div>
                            <div id="notifList"></div>
                        </div>
                    </div>
                    <a href="profile.html" class="btn btn-secondary btn-sm">Profile</a>
                    <button onclick="logout()" class="btn btn-secondary btn-sm">Logout</button>
                </div>
            </header>

            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--primary-bg); color: var(--primary);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalUsers">0</h3>
                        <p>Total Users</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--success-bg); color: var(--success);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 0 3 3h7z"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalSubjects">0</h3>
                        <p>Subjects</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--warning-bg); color: var(--warning);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalSessions">0</h3>
                        <p>Active Sessions</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: var(--danger-bg); color: var(--danger);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalAttendance">0</h3>
                        <p>Records</p>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <a href="admin-manage-users.html" class="btn btn-primary">Manage Users</a>
                <a href="admin-add-user.html" class="btn btn-secondary">Add User</a>
                <a href="admin-analytics.html" class="btn btn-secondary">Analytics</a>
                <a href="corrections-review.html" class="btn btn-secondary">Corrections</a>
            </div>
        </main>
    </div>

    <script>
        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';
            
            if (data.name) {
                document.getElementById('welcomeHeader').innerHTML = `
                    <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                    <span>Welcome, ${data.name}</span>
                `;
            }
            
            loadStats();
            
            // Manage submenu toggle
            const manageNav = document.getElementById('manageNav');
            const manageSubmenu = document.getElementById('manageSubmenu');
            manageNav.addEventListener('click', (e) => {
                e.preventDefault();
                manageSubmenu.style.display = manageSubmenu.style.display === 'none' ? 'flex' : 'none';
                manageNav.querySelector('svg:last-of-type').style.transform = manageSubmenu.style.display === 'none' ? 'rotate(0deg)' : 'rotate(180deg)';
            });
        })();

        async function loadStats() {
            const usersRes = await fetch('/api/users', { credentials: 'same-origin' });
            const users = await usersRes.json();
            document.getElementById('totalUsers').textContent = users.length;

            const subjectsRes = await fetch('/api/subjects', { credentials: 'same-origin' });
            const subjects = await subjectsRes.json();
            document.getElementById('totalSubjects').textContent = subjects.length;

            const sessionsRes = await fetch('/api/attendance/sessions/active', { credentials: 'same-origin' });
            const sessions = await sessionsRes.json();
            document.getElementById('totalSessions').textContent = sessions.length;

            const reportsRes = await fetch('/api/attendance/reports', { credentials: 'same-origin' });
            const reports = await reportsRes.json();
            document.getElementById('totalAttendance').textContent = reports.length;
        }

        function logout() {
            fetch('/api/logout', { credentials: 'same-origin' }).then(() => location.href = '/');
        }

        // Notification system
        let notifOpen = false;
        
        function toggleNotifications() {
            const dropdown = document.getElementById('notifDropdown');
            notifOpen = !notifOpen;
            dropdown.classList.toggle('show', notifOpen);
            if (notifOpen) loadNotifications();
        }

        function loadNotifications() {
            fetch('/api/notifications', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('notifList');
                    if (data.length === 0) {
                        list.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--gray-500);">No notifications</div>';
                        return;
                    }
                    list.innerHTML = data.map(n => `
                        <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="readNotification(${n.id}, ${n.is_read})">
                            <div class="notif-title">${n.title}</div>
                            <div class="notif-message">${n.message}</div>
                            <div class="notif-time">${new Date(n.created_at).toLocaleString()}</div>
                        </div>
                    `).join('');
                });
        }

        function readNotification(id, isRead) {
            if (isRead) return;
            fetch('/api/notifications/read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ notificationId: id })
            }).then(() => {
                loadNotifications();
                updateNotifCount();
            });
        }

        function readAllNotifications() {
            fetch('/api/notifications/read-all', {
                method: 'POST',
                credentials: 'same-origin'
            }).then(() => {
                loadNotifications();
                updateNotifCount();
            });
        }

        function updateNotifCount() {
            fetch('/api/notifications/unread-count', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    const countEl = document.getElementById('notifCount');
                    if (data.count > 0) {
                        countEl.textContent = data.count;
                        countEl.style.display = 'block';
                    } else {
                        countEl.style.display = 'none';
                    }
                });
        }

        // Update notification count on page load
        setTimeout(updateNotifCount, 500);
        
        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#notifBtn') && !e.target.closest('#notifDropdown')) {
                document.getElementById('notifDropdown').classList.remove('show');
                notifOpen = false;
            }
        });
    </script>
</body>
</html>
