<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="welcomeHeader">
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Admin Dashboard
            </h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <a href="profile.html" class="btn-secondary" style="text-decoration: none;">👤 Profile</a>
                <a href="admin-settings.html" class="btn-secondary" style="text-decoration: none;">⚙️ Settings</a>
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-content">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-content">
                    <h3 id="totalSubjects">0</h3>
                    <p>Subjects</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-content">
                    <h3 id="totalSessions">0</h3>
                    <p>Active Sessions</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✓</div>
                <div class="stat-content">
                    <h3 id="totalAttendance">0</h3>
                    <p>Attendance Records</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px;">
            <a href="admin-add-user.html" class="btn-primary" style="text-decoration: none;">➕ Add User</a>
            <a href="admin-add-subject.html" class="btn-primary" style="text-decoration: none;">📚 Add Subject</a>
            <a href="admin-sections.html" class="btn-primary" style="text-decoration: none;">📚 Add Section</a>
            <a href="admin-bulk-upload.html" class="btn-secondary" style="text-decoration: none;">📥 Bulk Upload</a>
            <a href="admin-add-face.html" class="btn-secondary" style="text-decoration: none;">📷 Add Face</a>
            <a href="admin-manage-users.html" class="btn-secondary" style="text-decoration: none;">⚙️ Manage Users</a>
        </div>
    </div>

    <script>
        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';
            
            if (data.name) {
                document.getElementById('welcomeHeader').innerHTML = `
                    <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                    Welcome, ${data.name}
                `;
            }
            
            loadStats();
        })();

        async function loadStats() {
            const usersRes = await fetch('/api/users', { credentials: 'same-origin' });
            const users = await usersRes.json();
            document.getElementById('totalUsers').textContent = users.length;

            const subjectsRes = await fetch('/api/subjects', { credentials: 'same-origin' });
            const subjects = await subjectsRes.json();
            document.getElementById('totalSubjects').textContent = subjects.length;

            const sessionsRes = await fetch('/api/attendance/sessions/active', { credentials: 'same-origin' });
            const sessions = await sessionsRes.json();
            document.getElementById('totalSessions').textContent = sessions.length;

            const reportsRes = await fetch('/api/attendance/reports', { credentials: 'same-origin' });
            const reports = await reportsRes.json();
            document.getElementById('totalAttendance').textContent = reports.length;
        }

        function logout() {
            fetch('/api/logout', { credentials: 'same-origin' }).then(() => location.href = '/');
        }
    </script>
</body>
</html>
