<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Admin Portal
            </h1>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </header>

        <div class="grid">
            <a href="admin-add-user.html" class="card" style="text-decoration: none; color: inherit; text-align: center;">
                <div style="font-size: 48px; margin-bottom: 10px;">👤</div>
                <h3>Add User</h3>
                <p style="color: var(--secondary); font-size: 14px;">Create new student or teacher account</p>
            </a>

            <a href="admin-add-subject.html" class="card" style="text-decoration: none; color: inherit; text-align: center;">
                <div style="font-size: 48px; margin-bottom: 10px;">📚</div>
                <h3>Add Subject</h3>
                <p style="color: var(--secondary); font-size: 14px;">Add new subjects to the system</p>
            </a>

            <a href="admin-add-face.html" class="card" style="text-decoration: none; color: inherit; text-align: center;">
                <div style="font-size: 48px; margin-bottom: 10px;">📷</div>
                <h3>Add Face</h3>
                <p style="color: var(--secondary); font-size: 14px;">Register face data for users</p>
            </a>

            <a href="admin-manage-users.html" class="card" style="text-decoration: none; color: inherit; text-align: center;">
                <div style="font-size: 48px; margin-bottom: 10px;">⚙️</div>
                <h3>Manage Users</h3>
                <p style="color: var(--secondary); font-size: 14px;">Reset passwords and delete users</p>
            </a>
        </div>
    </div>

    <script>
        function logout() {
            fetch('/api/logout').then(() => location.href = '/');
        }

        // Check auth
        (async () => {
            const res = await fetch('/api/session');
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';
        })();
    </script>
</body>
</html>
