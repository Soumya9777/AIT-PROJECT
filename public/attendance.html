<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Attendance Kiosk</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { padding: 1rem; justify-content: flex-start; }
        .kiosk-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .camera-container { aspect-ratio: 16/9; max-width: 100%; border: 2px solid var(--primary); }
        .log-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }
        .log-entry {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 1rem;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
<link rel="icon" href="images/college-logo.jpg" type="image/jpg">
</head>
<body>
    <div style="display: flex; justify-content: space-between; width: 100%; max-width: 1400px; margin-bottom: 1rem;">
        <h2 style="margin: 0; text-align: left;">Live Attendance Kiosk</h2>
        <button id="endSessionBtn" class="btn btn-danger" style="width: auto; padding: 0.5rem 1.5rem;">End Session</button>
    </div>

    <div class="kiosk-container">
        <!-- Live Camera Feed -->
        <div style="position: relative;">
            <div class="camera-container" id="camContainer">
                <video id="video" autoplay muted></video>
                <!-- Canvas for Face-API Overlays -->
                <canvas id="overlay"></canvas>
            </div>
            <div id="statusMsg" class="mt-2 text-center" style="font-size: 1.2rem; color: var(--text-muted);">Initializing...</div>
        </div>

        <!-- Real-time Recognition Log -->
        <div class="log-panel">
            <h3 style="text-align: left; margin-bottom: 1rem;">Recent Scans</h3>
            <div id="scanLog">
                <!-- Log entries appear here -->
                <p class="text-muted text-center" id="emptyLogMsg">Waiting for faces...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/face-api.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
