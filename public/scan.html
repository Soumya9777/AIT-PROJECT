<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Scan Attendance
            </h1>
            <a href="student.html" class="btn-secondary">Back</a>
        </header>

        <div class="card" style="text-align: center;">
            <h3>Step 1: Scan QR Code</h3>
            <p style="color: var(--secondary); margin-bottom: 20px;">Position the QR code within the frame</p>
            <div id="qr-reader" style="width: 100%; max-width: 300px; margin: 0 auto;"></div>
            <div id="qrResult" class="hidden" style="margin-top: 16px; padding: 12px; background: #d1fae5; border-radius: var(--radius-sm);"></div>
        </div>

        <div id="markAttendance" class="card hidden" style="text-align: center; margin-top: 20px;">
            <h3 style="color: var(--success);">✓ QR Code Scanned!</h3>
            <p>Your attendance is being marked...</p>
            <div id="attendanceMsg" style="margin-top: 16px;"></div>
        </div>
    </div>

    <script>
        let scannedSessionId = null;
        let scannedToken = null;

        // Check auth
        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.id || data.role !== 'student') location.href = '/';
            
            // Check face verification
            if (!data.faceVerified) {
                location.href = '/face-verify.html';
                return;
            }
        })();

        // Start QR scanner
        const html5Qrcode = new Html5Qrcode("qr-reader");
        html5Qrcode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            (decodedText) => {
                const data = JSON.parse(decodedText);
                scannedSessionId = data.sessionId;
                scannedToken = data.token;
                
                document.getElementById('qrResult').innerHTML = `✓ QR Scanned! Session ID: ${scannedSessionId}`;
                document.getElementById('qrResult').classList.remove('hidden');
                
                // Stop scanner
                html5Qrcode.stop();
                
                // Mark attendance
                markAttendance();
            },
            (error) => {}
        ).catch(err => console.error(err));

        async function markAttendance() {
            const markDiv = document.getElementById('markAttendance');
            markDiv.classList.remove('hidden');
            
            const res = await fetch('/api/attendance/verify-mark', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sessionId: scannedSessionId,
                    token: scannedToken
                }),
                credentials: 'same-origin'
            });
            
            const data = await res.json();
            const msgEl = document.getElementById('attendanceMsg');
            
            if (res.ok) {
                msgEl.innerHTML = `
                    <div style="padding: 16px; background: #d1fae5; border-radius: var(--radius-sm);">
                        <h3 style="color: var(--success);">✓ Attendance Marked!</h3>
                        <p>${data.message}</p>
                        <a href="student.html" class="btn-primary" style="display: inline-block; margin-top: 12px; text-decoration: none;">
                            Back to Dashboard
                        </a>
                    </div>
                `;
            } else {
                msgEl.innerHTML = `
                    <div style="padding: 16px; background: #fee2e2; border-radius: var(--radius-sm);">
                        <h3 style="color: var(--danger);">✗ Failed</h3>
                        <p>${data.error}</p>
                        <button onclick="location.reload()" class="btn-secondary" style="margin-top: 12px;">
                            Try Again
                        </button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
