<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="images/college-logo.jpg" type="image/jpg">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Scan Attendance
            </h1>
            <a href="student.html" class="btn-secondary">Back</a>
        </header>

        <div class="card" style="text-align: center;">
            <div style="margin-bottom: 24px;">
                <div style="width: 80px; height: 80px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">
                    📱
                </div>
                <h3 style="font-size: 24px; margin-bottom: 8px;">Scan QR Code</h3>
                <p style="color: var(--gray-500);">Position the QR code within the frame below</p>
            </div>
            
            <div id="qr-reader" style="width: 100%; max-width: 320px; margin: 0 auto;"></div>
            
            <div id="qrResult" class="hidden" style="margin-top: 20px; padding: 16px; background: #d1fae5; border-radius: var(--radius-sm); font-weight: 600; color: #065f46;"></div>
        </div>

        <div id="markAttendance" class="card hidden" style="text-align: center; margin-top: 24px;">
            <div style="font-size: 64px; margin-bottom: 16px;">⏳</div>
            <h3 style="margin-bottom: 8px;">Marking Attendance...</h3>
            <p style="color: var(--gray-500);">Please wait while we process your attendance</p>
            <div id="attendanceMsg" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        let scannedSessionId = null;
        let scannedToken = null;
        let collegeLocation = { lat: 21.8934, lng: 86.9325 }; // Default: NIST Berhampur coordinates
        const ALLOWED_RADIUS = 500; // meters

        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.id || data.role !== 'student') location.href = '/';
            
            if (!data.faceVerified) {
                location.href = '/face-verify.html';
                return;
            }

            // Load college location from settings
            const settings = JSON.parse(localStorage.getItem('ait-settings') || '{}');
            if (settings.collegeLocation) {
                collegeLocation = settings.collegeLocation;
            }

            // Check geofencing
            checkLocation();
        })();

        function checkLocation() {
            if (!navigator.geolocation) {
                showGeofenceError('Geolocation is not supported by your browser.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const distance = calculateDistance(
                        position.coords.latitude,
                        position.coords.longitude,
                        collegeLocation.lat,
                        collegeLocation.lng
                    );
                    
                    if (distance > ALLOWED_RADIUS) {
                        showGeofenceError(`You are ${Math.round(distance)}m away from campus. You must be within ${ALLOWED_RADIUS}m to mark attendance.`);
                    } else {
                        initializeScanner();
                    }
                },
                (error) => {
                    if (error.code === error.PERMISSION_DENIED) {
                        showGeofenceError('Location access denied. Please enable location services to mark attendance.');
                    } else {
                        showGeofenceError('Unable to get your location. Please try again.');
                    }
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth's radius in meters
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; // Distance in meters
        }

        function showGeofenceError(message) {
            document.getElementById('qr-reader').innerHTML = `
                <div style="padding: 40px 20px; text-align: center;">
                    <div style="font-size: 64px; margin-bottom: 16px;">📍</div>
                    <h3 style="color: #dc2626; margin-bottom: 8px;">Location Verification Failed</h3>
                    <p style="color: var(--gray-600);">${message}</p>
                    <button onclick="location.reload()" class="btn-secondary" style="margin-top: 16px;">Retry</button>
                </div>
            `;
        }

        function initializeScanner() {
            const html5Qrcode = new Html5Qrcode("qr-reader");
            html5Qrcode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 280 },
                (decodedText) => {
                    const data = JSON.parse(decodedText);
                    scannedSessionId = data.sessionId;
                    scannedToken = data.token;
                    
                    document.getElementById('qrResult').innerHTML = `✓ QR Scanned! Session: ${scannedSessionId}`;
                    document.getElementById('qrResult').classList.remove('hidden');
                    
                    html5Qrcode.stop();
                    markAttendance();
                },
                (error) => {}
            ).catch(err => console.error(err));
        }

        async function markAttendance() {
            const markDiv = document.getElementById('markAttendance');
            markDiv.classList.remove('hidden');
            
            const res = await fetch('/api/attendance/verify-mark', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sessionId: scannedSessionId,
                    token: scannedToken
                }),
                credentials: 'same-origin'
            });
            
            const data = await res.json();
            const msgEl = document.getElementById('attendanceMsg');
            
            if (res.ok) {
                msgEl.innerHTML = `
                    <div style="padding: 24px; background: #d1fae5; border-radius: var(--radius-sm);">
                        <div style="font-size: 64px; margin-bottom: 16px;">✓</div>
                        <h3 style="color: #065f46; margin-bottom: 8px;">Attendance Marked!</h3>
                        <p style="color: #047857;">${data.message}</p>
                        <a href="student.html" class="btn-primary" style="display: inline-block; margin-top: 20px; text-decoration: none;">
                            Back to Dashboard
                        </a>
                    </div>
                `;
            } else {
                msgEl.innerHTML = `
                    <div style="padding: 24px; background: #fee2e2; border-radius: var(--radius-sm);">
                        <div style="font-size: 64px; margin-bottom: 16px;">✗</div>
                        <h3 style="color: #991b1b; margin-bottom: 8px;">Failed</h3>
                        <p style="color: #dc2626;">${data.error}</p>
                        <button onclick="location.reload()" class="btn-secondary" style="margin-top: 16px;">
                            Try Again
                        </button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
