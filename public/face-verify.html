<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Verification | Smart Attendance</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <script src="js/face-api.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="images/college-logo.jpg" type="image/jpg">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="images/college-logo.jpg" alt="College Logo" style="height: 100px; margin-bottom: 20px;">
                <h2 style="color: white; font-size: 32px; font-weight: 900; margin-bottom: 12px;">Face Verification</h2>
                <p style="opacity: 0.95; font-size: 18px;">Logged in as: <strong id="currentUserDisplay"></strong></p>
            </div>

            <div class="login-body" style="text-align: center;">
                <div class="face-video-wrapper">
                    <video id="faceVideo" autoplay playsinline muted></video>
                </div>
                <canvas id="faceCanvas" style="display: none;"></canvas>
                
                <div id="faceStatus" style="margin: 20px 0; padding: 16px; border-radius: var(--radius-xs); font-weight: 600; font-size: 15px;">
                    Position your face in front of the camera...
                </div>
                
                <button onclick="verifyFace()" id="verifyBtn" class="btn-primary" style="width: 100%; padding: 18px; font-size: 18px;" disabled>
                    Verify Face
                </button>
                
                <div id="verifyMsg" style="margin-top: 20px;"></div>
                
                <button onclick="logout()" style="margin-top: 16px; background: none; border: none; color: var(--gray-500); cursor: pointer; font-size: 15px; font-weight: 600;">
                    Cancel / Logout
                </button>
            </div>
        </div>
    </div>

    <style>
        .face-video-wrapper { width: 100%; max-width: 400px; margin: 0 auto 20px; border-radius: var(--radius-sm); overflow: hidden; border: 2px solid var(--gray-200); background: #000; }
        #faceVideo { width: 100%; display: block; height: auto; }
        #faceCanvas { display: none; }
    </style>

    <script>
        let faceDescriptor = null;
        let detectionInterval = null;
        let currentUser = null;
        let myStoredDescriptor = null;
        let faceLoaded = false;
        const VERIFY_THRESHOLD = 0.55;

        (async () => {
            const sessionRes = await fetch('/api/session', { credentials: 'same-origin' });
            currentUser = await sessionRes.json();
            
            if (!currentUser.id || currentUser.role !== 'student') {
                location.href = '/';
                return;
            }

            document.getElementById('currentUserDisplay').textContent = currentUser.name;

            // Load my face data
            try {
                const faceRes = await fetch('/api/face/my-face', { credentials: 'same-origin' });
                if (faceRes.ok) {
                    const faceData = await faceRes.json();
                    myStoredDescriptor = faceData.descriptor;
                } else {
                    document.getElementById('faceStatus').textContent = 'No face data registered for your account. Contact admin to register your face.';
                    document.getElementById('faceStatus').style.background = '#fee2e2';
                    document.getElementById('faceStatus').style.color = '#991b1b';
                    return;
                }
            } catch (err) {
                document.getElementById('faceStatus').textContent = 'Error loading face data.';
                document.getElementById('faceStatus').style.background = '#fee2e2';
                document.getElementById('faceStatus').style.color = '#991b1b';
                return;
            }

            // Load face-api models
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('/models'),
                faceapi.nets.faceRecognitionNet.loadFromUri('/models'),
                faceapi.nets.faceLandmark68Net.loadFromUri('/models')
            ]);
            faceLoaded = true;

            // Start camera
            const video = document.getElementById('faceVideo');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 400, height: 300, facingMode: 'user' } });
            video.srcObject = stream;

            startFaceDetection();
        })();

        function startFaceDetection() {
            const video = document.getElementById('faceVideo');
            const canvas = document.getElementById('faceCanvas');
            const faceStatus = document.getElementById('faceStatus');
            
            canvas.width = 160;
            canvas.height = 160;
            
            let detecting = false;
            detectionInterval = setInterval(async () => {
                if (detecting || video.readyState < 2) return;
                detecting = true;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, 160, 160);
                
                try {
                    const detection = await faceapi.detectSingleFace(canvas, 
                        new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 }))
                        .withFaceLandmarks()
                        .withFaceDescriptor();
                    
                    if (detection) {
                        faceDescriptor = Array.from(detection.descriptor);
                        faceStatus.textContent = '✓ Face detected — click Verify';
                        faceStatus.style.background = '#d1fae5';
                        faceStatus.style.color = '#065f46';
                        document.getElementById('verifyBtn').disabled = false;
                    } else {
                        faceDescriptor = null;
                        faceStatus.textContent = 'Position your face in front of the camera...';
                        faceStatus.style.background = '#f3f4f6';
                        faceStatus.style.color = '#374151';
                        document.getElementById('verifyBtn').disabled = true;
                    }
                } catch(e) {}
                
                detecting = false;
            }, 500);
        }

        async function verifyFace() {
            if (!faceDescriptor) {
                alert('No face detected.');
                return;
            }

            const faceStatus = document.getElementById('faceStatus');
            const verifyMsg = document.getElementById('verifyMsg');
            
            faceStatus.textContent = 'Verifying...';
            faceStatus.style.background = '#dbeafe';
            faceStatus.style.color = '#1e40af';
            document.getElementById('verifyBtn').disabled = true;

            try {
                // Compare ONLY against MY registered face
                const distance = faceDistance(myStoredDescriptor, faceDescriptor);
                console.log('Face verification - My face distance:', distance.toFixed(3), 'Threshold:', VERIFY_THRESHOLD);

                if (distance <= VERIFY_THRESHOLD) {
                    verifyMsg.innerHTML = `<div class="text-success">✓ Face verified as ${currentUser.name}! (distance: ${distance.toFixed(3)}) Redirecting...</div>`;
                    
                    await fetch('/api/face-verify', {
                        method: 'POST',
                        credentials: 'same-origin'
                    });
                    
                    setTimeout(() => {
                        location.href = 'student.html';
                    }, 1500);
                } else {
                    verifyMsg.innerHTML = `<div class="text-danger">✗ Face not recognized. Distance ${distance.toFixed(3)} exceeds threshold ${VERIFY_THRESHOLD}. Please try again or contact admin to re-register your face.</div>`;
                    document.getElementById('verifyBtn').disabled = false;
                }
            } catch (err) {
                console.error(err);
                verifyMsg.innerHTML = '<div class="text-danger">Error during verification. Please try again.</div>';
                document.getElementById('verifyBtn').disabled = false;
            }
        }

        function faceDistance(desc1, desc2) {
            let sum = 0;
            for (let i = 0; i < desc1.length; i++) {
                sum += Math.pow(desc1[i] - desc2[i], 2);
            }
            return Math.sqrt(sum);
        }

        function logout() {
            fetch('/api/logout', { credentials: 'same-origin' }).then(() => location.href = '/');
        }
    </script>
</body>
</html>
