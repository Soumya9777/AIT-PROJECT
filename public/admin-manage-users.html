<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User | Admin Portal</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <link rel="icon" href="images/college-logo.jpg" type="image/jpg">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    AIT Attendance
                </h2>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </span>
                    Dashboard
                </a>
                <a href="admin-manage.html" class="nav-item active">
                    <span class="nav-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"/>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </span>
                    Manage
                </a>
                <div class="nav-submenu" style="display: flex;">
                    <a href="admin-manage-users.html" class="nav-subitem active">Users</a>
                    <a href="admin-manage-classes.html" class="nav-subitem">Classes</a>
                    <a href="admin-manage-subjects.html" class="nav-subitem">Subjects</a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>
                    <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                    Add User
                </h1>
                <a href="admin.html" class="btn-secondary">Back</a>
            </header>

            <div class="card">
                <div class="card-header">
                    <div class="card-header-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                    </div>
                    <h3>Add New User</h3>
                </div>
                
                <form id="addUserForm" style="max-width: 500px;">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="userName" required placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="userUsername" required placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="userPassword" required placeholder="Enter password">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="userRole" onchange="toggleSection()">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-group" id="sectionGroup">
                        <label>Section</label>
                        <select id="userSection"></select>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Add User</button>
                    <div id="addMsg" style="margin-top: 16px;"></div>
                </form>
            </div>
        </main>
    </div>

    <script>
        async function loadSections() {
            const res = await fetch('/api/sections', { credentials: 'same-origin' });
            const sections = await res.json();
            const select = document.getElementById('userSection');
            select.innerHTML = sections.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        }

        function toggleSection() {
            const role = document.getElementById('userRole').value;
            document.getElementById('sectionGroup').style.display = role === 'student' ? '' : 'none';
        }

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('userName').value;
            const username = document.getElementById('userUsername').value;
            const password = document.getElementById('userPassword').value;
            const role = document.getElementById('userRole').value;
            const section = role === 'student' ? document.getElementById('userSection').value : null;

            const res = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, username, password, role, section }),
                credentials: 'same-origin'
            });

            const msgEl = document.getElementById('addMsg');
            if (res.ok) {
                msgEl.innerHTML = '<div class="text-success">✓ User added successfully!</div>';
                document.getElementById('addUserForm').reset();
                toggleSection();
            } else {
                const data = await res.json();
                msgEl.innerHTML = `<div class="text-danger">✗ ${data.error}</div>`;
            }
            msgEl.classList.remove('hidden');
            setTimeout(() => msgEl.classList.add('hidden'), 5000);
        });

        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';
            loadSections();
        })();
    </script>
</body>
</html>
