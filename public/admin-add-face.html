<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Face | Admin Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/face-api.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Add Face Data</h1>
            <a href="admin.html" class="btn-secondary">Back</a>
        </header>

        <div class="card">
            <form id="addFaceForm">
                <div class="form-group">
                    <label>Select User</label>
                    <select id="faceUserId" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label>Capture Face</label><br>
                    <video id="faceVideo" width="320" height="240" autoplay></video>
                    <canvas id="faceCanvas" style="display:none;"></canvas><br>
                    <button type="button" id="captureBtn" onclick="captureFace()" class="btn-secondary" style="display:none;">Face Detected! Click to Capture</button>
                    <p id="faceStatus" style="color:#666;font-size:14px;margin-top:8px;">Position your face in front of the camera...</p>
                </div>
                <button type="submit" class="btn-primary">Save Face Data</button>
                <div id="faceMsg" class="hidden"></div>
            </form>
        </div>
    </div>

    <script>
        let faceDescriptor = null;
        let detectionInterval = null;

        (async () => {
            const res = await fetch('/api/session');
            const data = await res.json();
            if (!data.role || data.role !== 'admin') location.href = '/';

            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('/models'),
                faceapi.nets.faceRecognitionNet.loadFromUri('/models'),
                faceapi.nets.faceLandmark68Net.loadFromUri('/models')
            ]);

            const video = document.getElementById('faceVideo');
            const stream = await navigator.mediaDevices.getUserMedia({video: {}});
            video.srcObject = stream;

            const usersRes = await fetch('/api/users/without-faces');
            const users = await usersRes.json();
            const select = document.getElementById('faceUserId');
            select.innerHTML = users.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
            
            // Start continuous face detection
            startFaceDetection();
        })();

        function startFaceDetection() {
            const video = document.getElementById('faceVideo');
            const canvas = document.getElementById('faceCanvas');
            const captureBtn = document.getElementById('captureBtn');
            const faceStatus = document.getElementById('faceStatus');
            
            // Reduce video resolution for faster processing
            video.width = 160;
            video.height = 120;
            canvas.width = 160;
            canvas.height = 120;
            
            detectionInterval = setInterval(async () => {
                if (video.readyState !== 4) return;
                
                canvas.getContext('2d').drawImage(video, 0, 0, 160, 120);
                
                // Use faster detection with reduced options
                const detection = await faceapi.detectSingleFace(canvas, 
                    new faceapi.TinyFaceDetectorOptions({ inputSize: 160 }))
                    .withFaceLandmarks()
                    .withFaceDescriptor();
                
                if (detection) {
                    faceDescriptor = Array.from(detection.descriptor);
                    captureBtn.style.display = 'inline-block';
                    captureBtn.textContent = 'Face Detected! Click to Capture';
                    faceStatus.textContent = 'Face detected!';
                    faceStatus.className = 'text-success';
                } else {
                    faceDescriptor = null;
                    captureBtn.style.display = 'none';
                    faceStatus.textContent = 'Position your face in front of the camera...';
                    faceStatus.className = '';
                }
            }, 300); // Check every 300ms for faster response
        }

        function captureFace() {
            if (!faceDescriptor) {
                alert('No face detected. Position your face in the camera.');
                return;
            }
            alert('Face captured successfully!');
        }

        document.getElementById('addFaceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!faceDescriptor) return alert('Capture face first!');
            
            const res = await fetch('/api/faces', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    userId: faceUserId.value,
                    descriptor: faceDescriptor
                })
            });
            
            const msgEl = document.getElementById('faceMsg');
            if (res.ok) {
                msgEl.textContent = 'Face data saved!';
                msgEl.className = 'text-success';
                faceDescriptor = null;
            } else {
                msgEl.textContent = 'Error saving face data';
                msgEl.className = 'text-danger';
            }
            msgEl.classList.remove('hidden');
        });
    </script>
</body>
</html>
