<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Desk | Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="top-header">
        <div class="top-header-left">
            <div class="photo-placeholder">NO PHOTO<br>AVAILABLE</div>
            <div class="user-details">
                <p>Welcome <strong>Guest</strong></p>
                <p>Please log in</p>
            </div>
        </div>
        <div class="top-header-center">
            <h1 class="site-title">Student Desk</h1>
        </div>
        <div class="top-header-right">
            <!-- Time could go here -->
        </div>
    </div>
    
    <div class="secondary-nav">
        <span class="red-text">2025 & 2026 Graduating Batch can Download</span>
        <span class="blue-text">Placement Registration Process</span>
        <span class="blue-text">Download Resume Formats</span>
    </div>

    <!-- Login Form -->
    <div class="auth-container" id="loginSection">
        <div class="auth-header">User Login</div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <div id="loginError" class="text-danger hidden"></div>
        </form>
    </div>

    <!-- Change Password Form -->
    <div class="auth-container hidden" id="changePasswordSection">
        <div class="auth-header">Set New Password</div>
        <p style="font-size: 14px; margin-bottom: 15px; color: #1f4e79;">For security reasons, you must change your temporary password.</p>
        <form id="changePasswordForm">
            <input type="hidden" id="cpUsername">
            <input type="hidden" id="cpTempPassword">
            
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn-primary">Update Password</button>
            <div id="cpError" class="text-danger hidden"></div>
        </form>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
