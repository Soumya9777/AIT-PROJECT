<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System | NIST</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="images/college-logo.jpg" type="image/jpg">
    <link rel="icon" href="images/college-logo.jpg" type="image/jpg">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="login-container">
        <!-- Login Form -->
        <div class="card" id="loginSection">
            <div style="text-align: center; margin-bottom: 32px;">
                <img src="images/college-logo.jpg" alt="College Logo" style="height: 100px; margin-bottom: 16px;">
                <h1 style="color: var(--dark); font-size: 32px; font-weight: 800; margin: 0;">Smart Attendance</h1>
                <p style="color: var(--secondary); font-size: 16px; margin-top: 8px;">NIST - Sign in to continue</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                    <input type="checkbox" id="rememberMe" style="width: 16px; height: 16px;">
                    <label for="rememberMe" style="margin: 0; font-size: 14px; text-transform: none; letter-spacing: 0;">Remember Me</label>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; padding: 16px; font-size: 16px;">Sign In</button>
                <div id="loginError" class="text-danger hidden" style="margin-top: 16px;"></div>
            </form>
        </div>

        <!-- Change Password Form -->
        <div class="card hidden" id="changePasswordSection">
            <div style="text-align: center; margin-bottom: 24px;">
                <img src="images/college-logo.jpg" alt="College Logo" style="height: 60px; margin-bottom: 12px;">
                <h2>Set New Password</h2>
                <p style="color: var(--secondary); font-size: 14px;">For security, please change your temporary password.</p>
            </div>
            
            <form id="changePasswordForm">
                <input type="hidden" id="cpUsername">
                <input type="hidden" id="cpTempPassword">
                
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                    <div id="passwordStrength" style="display: none; margin-top: 8px; font-size: 12px; font-weight: 600;"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; padding: 16px; font-size: 16px;">Update Password</button>
                <div id="cpError" class="text-danger hidden" style="margin-top: 16px;"></div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
