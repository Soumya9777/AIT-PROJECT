<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Reports | Teacher Portal</title>
    <link rel="stylesheet" href="css/styles-professional.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="js/toast.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <img src="images/college-logo.jpg" alt="Logo" class="header-logo">
                Attendance Reports
            </h1>
            <a href="teacher.html" class="btn-secondary">Back</a>
        </header>

        <!-- Step 1: Select Section -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-icon">📚</div>
                <h3>Step 1: Select Section</h3>
            </div>
            <div style="display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Section</label>
                    <select id="sectionSelect" onchange="loadDates()">
                        <option value="">-- Select Section --</option>
                    </select>
                </div>
                <button onclick="loadDates()" class="btn-primary" style="height: fit-content;">🔍 Load</button>
            </div>
        </div>

        <!-- Step 2: Sessions (Dates & Topics) -->
        <div id="datesSection" class="card hidden" style="margin-top: 24px;">
            <div class="card-header">
                <div class="card-header-icon">📅</div>
                <h3>Step 2: Select Session</h3>
            </div>
            <div id="datesList"></div>
        </div>

        <!-- Step 3: Present/Absent Students -->
        <div id="attendanceDetails" class="card hidden" style="margin-top: 24px;">
            <div class="card-header">
                <div class="card-header-icon">👥</div>
                <h3 id="detailTitle">Attendance Details</h3>
                <button onclick="goBack()" class="btn-secondary" style="margin-left: auto;">← Back</button>
            </div>
            
            <!-- Present Students -->
            <div style="margin-top: 20px;">
                <h4 style="color: var(--success); margin-bottom: 12px;">✓ Present Students (<span id="presentCount">0</span>)</h4>
                <div id="presentList"></div>
            </div>

            <!-- Absent Students -->
            <div style="margin-top: 24px;">
                <h4 style="color: var(--danger); margin-bottom: 12px;">✗ Absent Students (<span id="absentCount">0</span>)</h4>
                <div id="absentList"></div>
            </div>
        </div>
    </div>

    <script>
        let allRecords = [];
        let allStudents = [];
        let selectedSection = null;
        let selectedSessionId = null;

        (async () => {
            const res = await fetch('/api/session', { credentials: 'same-origin' });
            const data = await res.json();
            if (!data.role || data.role !== 'teacher') location.href = '/';
            
            loadSections();
            loadAllStudents();
            loadReports();
        })();

        async function loadSections() {
            const res = await fetch('/api/sections', { credentials: 'same-origin' });
            const sections = await res.json();
            const select = document.getElementById('sectionSelect');
            select.innerHTML = '<option value="">-- Select Section --</option>' + 
                sections.map(s => `<option value="${s.name}">${s.name} ${s.description ? '(' + s.description + ')' : ''}</option>`).join('');
        }

        async function loadAllStudents() {
            const res = await fetch('/api/users', { credentials: 'same-origin' });
            const users = await res.json();
            allStudents = users.filter(u => u.role === 'student');
        }

        async function loadReports() {
            const res = await fetch('/api/attendance/reports', { credentials: 'same-origin' });
            allRecords = await res.json();
        }

        async function loadDates() {
            selectedSection = document.getElementById('sectionSelect').value;
            if (!selectedSection) {
                document.getElementById('datesSection').classList.add('hidden');
                document.getElementById('attendanceDetails').classList.add('hidden');
                return;
            }

            // Filter records by section
            const sectionRecords = allRecords.filter(r => r.section_name === selectedSection);
            
            if (sectionRecords.length === 0) {
                document.getElementById('datesList').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--gray-400);">
                        <div style="font-size: 48px; margin-bottom: 12px;">📭</div>
                        <p>No attendance records for ${selectedSection}</p>
                    </div>
                `;
                document.getElementById('datesSection').classList.remove('hidden');
                return;
            }

            // Get UNIQUE sessions (NOT grouping by date+topic, but by actual session_id)
            const sessionsMap = {};
            sectionRecords.forEach(r => {
                if (!sessionsMap[r.session_id]) {
                    sessionsMap[r.session_id] = {
                        sessionId: r.session_id,
                        date: new Date(r.timestamp).toLocaleDateString(),
                        time: new Date(r.timestamp).toLocaleTimeString(),
                        topic: r.topic,
                        subject: r.subject
                    };
                }
            });

            const container = document.getElementById('datesList');
            container.innerHTML = Object.values(sessionsMap).map(s => `
                <div class="list-item" onclick="loadAttendanceDetails(${s.sessionId}, '${s.date}', '${s.topic}', '${s.subject}')" style="cursor: pointer;">
                    <div>
                        <strong style="font-size: 16px;">${s.date}</strong><br>
                        <span style="color: var(--gray-500); font-size: 14px;">
                            ${s.topic} • ${s.subject}
                        </span><br>
                        <span style="color: var(--gray-400); font-size: 13px;">
                            🕐 ${s.time}
                        </span>
                    </div>
                    <span style="color: var(--primary); font-size: 13px;">View Details →</span>
                </div>
            `).join('');

            document.getElementById('datesSection').classList.remove('hidden');
            document.getElementById('attendanceDetails').classList.add('hidden');
        }

        async function loadAttendanceDetails(sessionId, date, topic, subject) {
            selectedSessionId = sessionId;

            document.getElementById('detailTitle').textContent = `${selectedSection} - ${date} - ${topic}`;
            
            // Get attended students for THIS session from allRecords
            const sessionRecords = allRecords.filter(r => r.session_id == sessionId);
            const attendedStudentNames = sessionRecords.map(r => r.student_name);

            // Get students in the SAME section
            const sectionStudentNames = allStudents
                .filter(u => u.section === selectedSection)
                .map(u => u.name);

            // Present students
            const presentContainer = document.getElementById('presentList');
            presentContainer.innerHTML = attendedStudentNames.map(name => `
                <div class="list-item">
                    <div>
                        <strong>${name}</strong>
                    </div>
                    <span class="badge badge-success">Present</span>
                </div>
            `).join('');

            document.getElementById('presentCount').textContent = attendedStudentNames.length;

            // Absent students (section students minus attended)
            const absentNames = sectionStudentNames.filter(name => !attendedStudentNames.includes(name));
            const absentContainer = document.getElementById('absentList');
            
            if (absentNames.length === 0) {
                absentContainer.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--gray-400);">
                        <p>All students present! 🎉</p>
                    </div>
                `;
            } else {
                absentContainer.innerHTML = absentNames.map(name => `
                    <div class="list-item">
                        <div>
                            <strong>${name}</strong>
                        </div>
                        <span class="badge badge-danger">Absent</span>
                    </div>
                `).join('');
            }

            document.getElementById('absentCount').textContent = absentNames.length;

            document.getElementById('datesSection').classList.add('hidden');
            document.getElementById('attendanceDetails').classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('attendanceDetails').classList.add('hidden');
            document.getElementById('datesSection').classList.remove('hidden');
        }

        function logout() {
            fetch('/api/logout', { credentials: 'same-origin' }).then(() => location.href = '/');
        }
    </script>
</body>
</html>
